[workspace]
members = ["rust/spa-reader", "rust/spa-inspector", "rust/spa-launch", "rust/spa-control"]
default-members = ["rust/spa-launch"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/specshell/SpaInspector"

[profile.release]
opt-level = 2
lto = "thin"

[profile.release.package.spa-reader]
opt-level = 3

# Keep parsing and exports fast during normal desktop development.
[profile.dev.package.spa-reader]
opt-level = 3

# Interactive plotting must stay responsive in `cargo run desktop` too.
[profile.dev.package.spa-inspector]
opt-level = 1

[profile.dev.package.egui]
opt-level = 3

[profile.dev.package.egui_plot]
opt-level = 3

[profile.dev.package.epaint]
opt-level = 3

[profile.dev.package.emath]
opt-level = 3

[profile.dev.package.ecolor]
opt-level = 3
