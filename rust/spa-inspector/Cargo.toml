[package]
name = "spa-inspector"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT"

[dependencies]
spa-reader = { path = "../spa-reader" }
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "x11", "wayland"] }
egui_plot = "0.37.0"
rfd = { version = "0.17.2", features = ["file-handle-inner"] }
serde_json = "1.0"
base64 = "0.23.1"
image = { version = "0.25", default-features = false, features = ["png"] }
# Keep this version aligned with egui's accessibility types.
accesskit = { version = "0.24.1", features = ["serde"] }
spa-control = { path = "../spa-control" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1.0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "File", "WebSocket", "MessageEvent", "Location"] }

[dev-dependencies]
egui_kittest = { version = "0.36.2", default-features = false, features = ["eframe"] }
