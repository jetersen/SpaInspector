<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Inspect local SPA spectra, interferograms and metadata in your browser.">
  <title>SPA Inspector</title>
  <link data-trunk rel="rust" data-bin="spa-inspector">
  <base data-trunk-public-url>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #131923; }
    canvas { width: 100%; height: 100%; display: block; }
    #loading { position: absolute; inset: 40% 10%; color: #e4edf5; text-align: center; font: 16px system-ui, sans-serif; }
  </style>
</head>
<body>
  <canvas id="spa-canvas"></canvas>
  <div id="loading">Loading SPA Inspector…<noscript> Enable JavaScript to inspect files locally.</noscript></div>
</body>
</html>
