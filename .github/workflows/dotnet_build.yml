name: Build and test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Check public distribution boundary
        run: python tools/check-public-boundary.py
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Set up Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.0
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo build --locked --release --workspace
      - run: dotnet test SpaInspector.sln -c Release --nologo
      - name: Compare Rust and C# exports
        run: python tools/check-parity.py
      - name: Pack reader libraries
        run: |
          dotnet pack src/SpaInspectorReader -c Release --no-build
          dotnet pack src/SpaFileReader -c Release --no-build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Rust and Trunk
        run: |
          rustup toolchain install 1.99.0 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.99.0
          cargo install trunk --version 0.21.14 --locked
      - name: Build egui WebAssembly
        working-directory: rust/spa-inspector
        env:
          NO_COLOR: 'true'
        run: trunk build --release
