name: .NET Release

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  RELEASE: 'true'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check public distribution boundary
        run: python tools/check-public-boundary.py
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test SpaInspector.sln -c Release --nologo
      - name: Pack with the release tag version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          dotnet pack src/SpaInspectorReader -c Release -p:Version="$version" -o artifacts/packages
          dotnet pack src/SpaFileReader -c Release -p:Version="$version" -o artifacts/packages
      - name: Push NuGet
        run: dotnet nuget push 'artifacts/packages/*.nupkg' --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
