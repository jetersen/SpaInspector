name: GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 tools/check-public-boundary.py
      - uses: actions/configure-pages@v5
      - name: Install build tools
        run: |
          rustup toolchain install 1.99.0 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.99.0
          cargo install trunk --version 0.21.14 --locked
      - name: Build browser viewer
        working-directory: rust/spa-inspector
        env:
          NO_COLOR: 'true'
        run: trunk build --release --public-url '/${{ github.event.repository.name }}/' --dist ../../artifacts/pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
